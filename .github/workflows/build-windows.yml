name: Build V1 Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'SS_OIL_V1_MERKEZ_8767_ENTEGRE.zip'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V1 source
        shell: pwsh
        run: Expand-Archive -LiteralPath "SS_OIL_V1_MERKEZ_8767_ENTEGRE.zip" -DestinationPath "source" -Force
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source
        shell: pwsh
        run: python -m py_compile source/SS_OIL_SMJENE.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SS_OIL_SMJENE source/SS_OIL_SMJENE.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SS_OIL_V1_Windows_EXE
          path: dist/SS_OIL_SMJENE.exe
          if-no-files-found: error
